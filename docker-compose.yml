version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cinely-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinely
      POSTGRES_USER: cinely
      POSTGRES_PASSWORD: cinely_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinely -d cinely"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cinely-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinely-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://cinely:cinely_dev_password@postgres:5432/cinely
      USE_SQLITE_MEM: "false"
      REDIS_URL: redis://redis:6379
      CINELY_MASTER_KEY: cinely-production-master-key-32byteslong!
      CORS_ALLOWED_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./cinely-web
      dockerfile: Dockerfile
    container_name: cinely-web
    restart: unless-stopped
    depends_on:
      - engine
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  redis_data:
